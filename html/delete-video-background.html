<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video Background</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
        }

        .content {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            padding-top: 20%;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <video autoplay muted loop class="video-bg">
        <source src="../videos/Fall Backup.mp4" type="video/mp4" />
    </video>

    <div class="content">
        <h1>Welcome to My Page</h1>
        <p>This is a video background example.</p>
    </div>

</body>

</html>
